name: Daily Dashboard

on:
  push:
    branches: [ main, feat-daily-dashboard ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Create nix folder to silence warning
        run: mkdir -p ~/.nix-defexpr/channels

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix

      - uses: cachix/cachix-action@v15
        with:
          name: johngavin
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true # Don't push standard pkgs, only project specific if needed

      - name: Build Nix Environment
        run: nix-build --quiet default.nix

      - name: Run Targets Pipeline
        run: |
          mkdir -p R-lib-local
          echo 'local_lib <- file.path(getwd(), "R-lib-local"); if(dir.exists(local_lib)) .libPaths(c(local_lib, .libPaths()))' > .Rprofile
          nix-shell default.nix --run "R CMD INSTALL . -l R-lib-local && if [ -f '_targets.R' ]; then R -e 'targets::tar_make()'; fi"

      - name: Render Quarto Site
        run: nix-shell default.nix --run "quarto render"

      - name: Expose Quarto to GHA Path
        run: |
          QUARTO_BIN_DIR=$(nix-shell default.nix --run "dirname \$(which quarto)")
          echo "$QUARTO_BIN_DIR" >> $GITHUB_PATH

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
