name: Daily Dashboard

on:
  push:
    branches: [ main, feat-daily-dashboard ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-22.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Create nix folder to silence warning
        run: mkdir -p ~/.nix-defexpr/channels

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix

      - uses: cachix/cachix-action@v15
        with:
          name: johngavin
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true # Don't push standard pkgs, only project specific if needed

      - name: Build Nix Environment
        run: nix-build --quiet default.nix

      - name: Run Targets Pipeline
        run: |
          mkdir -p R-lib-local
          echo 'local_lib <- file.path(getwd(), "R-lib-local"); if(dir.exists(local_lib)) .libPaths(c(local_lib, .libPaths()))' > .Rprofile
          nix-shell default.nix --run "R CMD INSTALL . -l R-lib-local && if [ -f '_targets.R' ]; then R -e 'targets::tar_make()'; fi"

      - name: Render Quarto Site
        run: nix-shell default.nix --run "quarto render"

      - name: Expose Quarto to GHA Path
        run: |
          QUARTO_BIN_DIR=$(nix-shell default.nix --run "dirname \$(which quarto)")
          echo "$QUARTO_BIN_DIR" >> $GITHUB_PATH

      - name: Create gh-pages branch if missing
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          if ! git ls-remote --exit-code --heads origin gh-pages; then
            echo "Creating gh-pages branch..."
            git checkout --orphan gh-pages
            git reset --hard
            git commit --allow-empty -m "Initialize gh-pages branch"
            git push origin gh-pages
            git checkout ${{ github.sha }}
          fi

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs
          render: false # We already rendered it
