name: Daily Dashboard Update

on:
  push:
    branches: [main, master, feat-daily-dashboard]
  pull_request:
    branches: [main, master, feat-daily-dashboard]
  schedule:
    - cron: '0 6 * * *' # Run daily at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Create nix folder to silence warning
        run: mkdir -p ~/.nix-defexpr/channels

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/rstats-on-nix/nixpkgs/archive/refs/heads/r-daily.tar.gz

      - uses: cachix/cachix-action@v15
        with:
          name: johngavin
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true

      - name: Run build script
        working-directory: /home/runner/work/daily_dashboard/daily_dashboard
        run: |
          nix-shell default.nix --quiet --run "Rscript -e 'targets::tar_make()'"

      - name: Render and Publish Quarto Project
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Send Email on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Daily Dashboard Update Failed
          to: john.b.gavin+dashboard.daily@gmail.com
          from: Daily Dashboard <${{ secrets.EMAIL_USERNAME }}>
          body: The daily dashboard update workflow failed. Please check the logs.

  deploy:
    needs: update-dashboard
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4